<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Store screenshots</title>
  <style>
    html, body { margin: 0; background: #fff; }
    .frame {
      width: 1280px;
      height: 800px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, #2e9e5b, #145c33);
    }
    .frame.dark { background: linear-gradient(140deg, #1d2a33, #0b1116); }
    .shell {
      width: 380px;
      height: 580px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .2);
      background: #fff;
    }
    .shell.wide { width: 1100px; height: 700px; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .caption {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      text-align: center;
      font: 600 26px/1.3 "Segoe UI", system-ui, sans-serif;
      color: #fff;
      letter-spacing: -.01em;
    }
    .frame { position: relative; }
  </style>
</head>
<body>
  <!-- Screenshot each .frame at 1280x800 for the store listing. -->
  <div class="frame">
    <p class="caption">ყველა თქვენი საიტი ერთ დაჭერაზე</p>
    <div class="shell"><iframe src="popup.html" title="Popup, grid view"></iframe></div>
  </div>
  <div class="frame dark">
    <p class="caption">Search, pin, and open with the keyboard</p>
    <div class="shell"><iframe src="popup.html" title="Popup, dark theme"></iframe></div>
  </div>
  <div class="frame dark">
    <p class="caption">Your list — add, rename, recolour, reorder</p>
    <div class="shell wide"><iframe src="options.html" title="Options page"></iframe></div>
  </div>
</body>
</html>
