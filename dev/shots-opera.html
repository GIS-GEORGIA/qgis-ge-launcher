<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Opera screenshot</title>
<style>
  /* Opera add-ons wants 612x408 on a white background, so the popup is shown
     at 1:1 rather than shrunk into a branded backdrop — at this size a scaled
     popup would be unreadable. */
  html, body { margin: 0; width: 612px; height: 408px; overflow: hidden; background: #fff; }
  .frame {
    width: 612px; height: 408px;
    display: flex; align-items: center; gap: 22px;
    padding: 12px 20px 12px 14px;
    box-sizing: border-box;
    background: #fff;
    font-family: "Segoe UI", system-ui, "Noto Sans Georgian", sans-serif;
  }
  .shell {
    flex: none;
    width: 380px; height: 384px;
    border-radius: 12px; overflow: hidden;
    background: #fff;
    border: 1px solid #e1e6ea;
    box-shadow: 0 6px 22px rgba(16, 24, 32, .13);
  }
  .shell.wide { width: 420px; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .side { flex: 1 1 auto; min-width: 0; color: #16202a; }
  .side h2 { margin: 0 0 8px; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .side p { margin: 0; font-size: 13.5px; line-height: 1.5; color: #4a5866; }
  .side ul { margin: 12px 0 0; padding-left: 17px; font-size: 13px; line-height: 1.6; color: #4a5866; }
</style>
</head>
<body>
<script>
(function () {
  var SHOTS = {
    1: {
      page: 'popup.html', wide: false,
      settings: { lang: 'ka', theme: 'light', density: 'grid' },
      title: 'ერთი დაჭერა — და საიტი ღიაა',
      text: 'თქვენი ბმულები ხელსაწყოთა ზოლში, ჯგუფებად დალაგებული.',
      bullets: ['რჩეულები ყოველთვის ზემოთ', 'ღია და მუქი თემა', 'ქართული და English'],
    },
    2: {
      page: 'popup.html', wide: false,
      settings: { lang: 'en', theme: 'dark', density: 'grid' },
      search: 'docs',
      title: 'Search, then open',
      text: 'Type to filter by title, URL or keyword.',
      bullets: ['Enter opens the first match', 'Alt+1…9 opens one directly', 'Alt+Shift+G opens the popup'],
    },
    3: {
      page: 'options.html', wide: true,
      settings: { lang: 'ka', theme: 'light', density: 'grid' },
      title: 'სია სრულად თქვენია',
      text: 'დაამატეთ, გადაარქვით, გადაალაგეთ, დააჯგუფეთ.',
      bullets: ['ორენოვანი სახელები', 'JSON იმპორტი და ექსპორტი', 'ცვლილებები თავისთავად ინახება'],
    },
  };

  var n = new URLSearchParams(location.search).get('shot') || '1';
  var shot = SHOTS[n] || SHOTS[1];

  fetch('demo-state.json').then(function (r) { return r.json(); }).then(function (state) {
    delete state._comment;
    Object.assign(state.settings, shot.settings);
    var raw = JSON.stringify(state);
    localStorage.setItem('devshim:sync:state', raw);
    localStorage.setItem('devshim:local:state', raw);

    var frame = document.createElement('div');
    frame.className = 'frame';

    var shell = document.createElement('div');
    shell.className = 'shell' + (shot.wide ? ' wide' : '');

    var iframe = document.createElement('iframe');
    iframe.title = shot.title;
    iframe.addEventListener('load', function () {
      var doc = iframe.contentDocument;
      if (shot.search) {
        var box = doc.getElementById('search');
        box.value = shot.search;
        box.dispatchEvent(new iframe.contentWindow.Event('input', { bubbles: true }));
      }
      doc.documentElement.style.setProperty('scrollbar-width', 'none');
      document.documentElement.dataset.ready = '1';
    });
    iframe.src = shot.page;
    shell.append(iframe);

    var side = document.createElement('div');
    side.className = 'side';
    var h2 = document.createElement('h2');
    h2.textContent = shot.title;
    var p = document.createElement('p');
    p.textContent = shot.text;
    var ul = document.createElement('ul');
    shot.bullets.forEach(function (b) {
      var li = document.createElement('li');
      li.textContent = b;
      ul.append(li);
    });
    side.append(h2, p, ul);

    frame.append(shell, side);
    document.body.append(frame);
  });
}());
</script>
</body>
</html>
